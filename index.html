<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar - agendaDS2</title>

  <meta name="theme-color" content="#1f5f8b">

  <link rel="stylesheet" href="css/estilo.css">

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icones/icone-192.png">
</head>

<body class="pagina-entrada">

  <!-- Fica atrás de tudo, cobrindo a tela inteira. -->
  <div class="imagem-fundo"></div>

  <main class="cartao-entrada">

    <h1 class="marca-entrada">
      <img src="imagens/agenda-ds2.png"
           alt="agendaDS2: biblioteca, laboratório e horários">
    </h1>

    <form id="formulario-login" class="formulario">

      <label for="email-login">E-mail</label>
      <input type="email" id="email-login" required>

      <label for="senha-login">Senha</label>
      <input type="password" id="senha-login" required>

      <button type="submit" class="botao botao-principal">Entrar</button>
    </form>

    <p id="mensagem" class="mensagem escondido"></p>

    <p class="nota-do-rodape">
      Prefere baixar o app instalável?
      <a href="Download-do-app.html">Clique aqui</a>
    </p>

  </main>


  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script src="js/firebase-config.js"></script>

  <script src="js/autenticacao.js"></script>

  <script src="js/instalar-pwa.js"></script>

</body>
</html>
