<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar - Agendamento Escolar</title>

  <meta name="theme-color" content="#1f5f8b">

  <link rel="stylesheet" href="css/estilo.css">

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icones/icone-192.png">
</head>

<body class="pagina-entrada">

  <main class="cartao-entrada">

    <header class="cabecalho-entrada">
      <h1>Agendamento Escolar</h1>
      <p class="subtitulo">Laboratório de Informática e Biblioteca</p>
    </header>

    <form id="formulario-login" class="formulario">

      <label for="email-login">E-mail</label>
      <input type="email" id="email-login" required>

      <label for="senha-login">Senha</label>
      <input type="password" id="senha-login" required>

      <button type="submit" class="botao botao-principal">Entrar</button>
    </form>

    <p id="mensagem" class="mensagem escondido"></p>

  </main>


  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script src="js/firebase-config.js"></script>

  <script src="js/autenticacao.js"></script>

  <script src="js/instalar-pwa.js"></script>

</body>
</html>
